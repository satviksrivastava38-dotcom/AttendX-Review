<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#170d2e">
  <title>AttendX | Review</title>
  <style>
    :root {
      color-scheme: dark;
      --purple: #a78bfa;
      --lavender: #d8c8ff;
      --ink: #170d2e;
      --muted: #c7bddb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(168, 85, 247, .35), transparent 38%),
        radial-gradient(ellipse at 90% 85%, rgba(99, 102, 241, .28), transparent 40%),
        linear-gradient(135deg, #10091f 0%, #241044 48%, #130b2b 100%);
      display: flex;
      flex-direction: column;
    }
    header {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .logo {
      width: 48px; height: 48px; object-fit: contain;
      background: #050505; border-radius: 12px; padding: 4px;
    }
    .brand { font-size: 1.2rem; font-weight: 750; letter-spacing: .3px; }
    .brand span { color: var(--lavender); }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 28px 20px 64px;
    }
    .panel {
      width: min(100%, 650px);
      padding: clamp(26px, 5vw, 48px);
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 28px;
      background: rgba(255,255,255,.085);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: #e3d7ff; font-size: .76rem; font-weight: 750;
      letter-spacing: .18em; text-transform: uppercase;
    }
    .eyebrow::before {
      content: ""; width: 22px; height: 2px; background: var(--purple);
    }
    h1 { margin: 14px 0 9px; font-size: clamp(2.2rem, 7vw, 3.5rem); line-height: 1; letter-spacing: -.045em; }
    .intro { margin: 0 0 30px; color: var(--muted); line-height: 1.65; }
    .field { margin: 21px 0; }
    label, legend { display: block; margin-bottom: 9px; font-size: .92rem; font-weight: 650; color: #f3edff; }
    input, textarea {
      width: 100%; border: 1px solid rgba(226,215,255,.25);
      border-radius: 13px; padding: 14px 15px;
      background: rgba(13,7,28,.48); color: white; font: inherit;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder, textarea::placeholder { color: #9f94b6; }
    input:focus, textarea:focus {
      border-color: var(--purple); box-shadow: 0 0 0 3px rgba(167,139,250,.17);
    }
    textarea { min-height: 135px; resize: vertical; }
    fieldset { border: 0; padding: 0; margin: 23px 0 25px; }
    .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 7px; }
    .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .stars label {
      cursor: pointer; margin: 0; font-size: 2.15rem; line-height: 1;
      color: rgba(255,255,255,.25); transition: color .15s, transform .15s;
    }
    .stars label:hover, .stars label:hover ~ label,
    .stars input:checked ~ label { color: #ffd166; }
    .stars label:active { transform: scale(.92); }
    .stars input:focus-visible + label { outline: 2px solid white; outline-offset: 4px; border-radius: 4px; }
    .rating-hint { margin: 9px 0 0; color: #bcb0d2; font-size: .8rem; }
    button {
      width: 100%; border: 0; border-radius: 14px; padding: 15px 20px;
      color: #1b1030; font: inherit; font-weight: 800; cursor: pointer;
      background: linear-gradient(100deg, #d7c5ff, #a78bfa 55%, #c4b5fd);
      box-shadow: 0 10px 28px rgba(139,92,246,.25);
      transition: transform .18s, filter .18s;
    }
    button:hover { transform: translateY(-2px); filter: brightness(1.07); }
    button:active { transform: translateY(0); }
    .privacy { margin: 15px 0 0; color: #a99cbe; text-align: center; font-size: .78rem; line-height: 1.5; }
    footer { padding: 18px 20px 25px; text-align: center; color: #9e91b6; font-size: .78rem; }
    @media (max-width: 480px) {
      header { width: calc(100% - 32px); padding: 20px 0; }
      main { padding: 18px 14px 42px; }
      .panel { border-radius: 22px; }
    }
  </style>
</head>

          <label for="contact">Phone number or email address</label>
          <input id="contact" name="contact" type="text" placeholder="How can we reach you?" autocomplete="email" maxlength="150" required>
        </div>

        <fieldset>
          <legend>Your rating</legend>
          <div class="stars" role="radiogroup" aria-label="Star rating">
            <input id="star5" type="radio" name="rating" value="5" required><label for="star5" title="5 stars">★</label>
            <input id="star4" type="radio" name="rating" value="4"><label for="star4" title="4 stars">★</label>
            <input id="star3" type="radio" name="rating" value="3"><label for="star3" title="3 stars">★</label>
            <input id="star2" type="radio" name="rating" value="2"><label for="star2" title="2 stars">★</label>
            <input id="star1" type="radio" name="rating" value="1"><label for="star1" title="1 star">★</label>
          </div>
          <p class="rating-hint">Choose from 1 to 5 stars.</p>
        </fieldset>

        <div class="field">
          <label for="review">Your review</label>
          <textarea id="review" name="review" placeholder="Share your experience with AttendX..." maxlength="3000" required></textarea>
        </div>

        <button type="submit">Submit review <span aria-hidden="true">↗</span></button>
        <p class="privacy">Your review will be sent securely through Formspree.</p>
      </form>
    </section>
  </main>

  <footer>© <span id="year"></span> AttendX. All rights reserved.</footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const reviewForm = document.querySelector("form");
    reviewForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const submitButton = reviewForm.querySelector('button[type="submit"]');
      const originalButtonText = submitButton.innerHTML;
      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      try {
        const response = await fetch(reviewForm.action, {
          method: "POST",
          body: new FormData(reviewForm),
          headers: { "Accept": "application/json" }
        });

        if (response.ok) {
          reviewForm.reset();
          alert("Review submitted! Thank you for your feedback.");
        } else {
          let message = "We couldn't submit your review. Please try again.";
          try {
            const result = await response.json();
            if (result.errors && result.errors.length) {
              message = result.errors.map(error => error.message).join("\\n");
            }
          } catch (_) {}
          alert(message);
        }
      } catch (error) {
        alert("Network error. Please check your connection and try again.");
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = originalButtonText;
      }
    });
  </script>
</body>
</html>
